name: Ежедневный сбор

on:
  schedule:
    # 03:17 UTC — ночь по Москве, нечётная минута, чтобы не попадать в общую очередь на :00
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Google Chrome на ubuntu-latest предустановлен — playwright-core берёт его через channel "chrome"
      - name: Сбор новых постов
        run: npm run collect

      - name: Разбор, жанры, статистика
        run: |
          npm run parse
          npm run genres > data/genres.tsv
          npm run stats > /dev/null

      - name: Коммит, если что-то изменилось
        run: |
          git add data
          if git diff --cached --quiet; then
            echo "Новых постов нет"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(data): daily update $(date -u +%F)"
          git push
